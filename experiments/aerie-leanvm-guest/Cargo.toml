[package]
name = "aerie-leanvm-guest"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["../aerie-port/std"]

[features]
default = ["trusted-public-setup", "trusted-terminal-cache"]
trusted-public-setup = ["dep:aerie-falcon", "dep:akita-types", "dep:akita-serialization"]
trusted-terminal-cache = ["trusted-public-setup"]
prepare-all-schedules = ["dep:aerie-falcon", "aerie-falcon/prepare-all-schedules"]

[dependencies]
aerie-verifier = { path = "../aerie-port/aerie/crates/aerie-verifier", default-features = false }
aerie-wrapper-format = { path = "../aerie-wrapper-format" }
leanvm_guest = { path = "../../vendor/leanVM-riscv/sdk" }
std = { package = "aerie-guest-std", path = "../aerie-port/std" }
getrandom = { version = "=0.2.17", default-features = false, features = ["custom"] }
linked_list_allocator = { version = "=0.10.5", default-features = false }
aerie-falcon = { path = "../aerie-port/aerie/crates/aerie-falcon", default-features = false, optional = true }
akita-types = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "e023b6a46143f7b23199ccecb2684192baf7b640", optional = true }
akita-serialization = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "e023b6a46143f7b23199ccecb2684192baf7b640", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 0


[patch.crates-io]
once_cell = { path = "../aerie-port/deps/once_cell" }
tracing-core = { path = "../aerie-port/deps/tracing-core" }
getrandom = { path = "../aerie-port/deps/getrandom" }
rand_core = { path = "../aerie-port/deps/rand_core" }
rand = { path = "../aerie-port/deps/rand" }

[patch."https://github.com/LayerZero-Labs/akita.git"]
akita-algebra = { path = "../aerie-port/akita/crates/akita-algebra" }
akita-challenges = { path = "../aerie-port/akita/crates/akita-challenges" }
akita-config = { path = "../aerie-port/akita/crates/akita-config" }
akita-error = { path = "../aerie-port/akita/crates/akita-error" }
akita-params = { path = "../aerie-port/akita/crates/akita-params" }
akita-schedules = { path = "../aerie-port/akita/crates/akita-schedules" }
akita-serialization = { path = "../aerie-port/akita/crates/akita-serialization" }
akita-sumcheck = { path = "../aerie-port/akita/crates/akita-sumcheck" }
akita-transcript = { path = "../aerie-port/akita/crates/akita-transcript" }
akita-types = { path = "../aerie-port/akita/crates/akita-types" }
akita-verifier = { path = "../aerie-port/akita/crates/akita-verifier" }
