[package]
name = "aerie-q64-cache-check"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
aerie = { path = "../aerie-port/aerie/crates/aerie", default-features = false, features = ["verifier"] }
aerie-falcon = { path = "../aerie-port/aerie/crates/aerie-falcon", default-features = false, features = ["internals"] }
akita-algebra = { path = "../aerie-port/akita/crates/akita-algebra" }
akita-params = { path = "../aerie-port/akita/crates/akita-params", default-features = false, features = ["transcript-blake2b"] }
akita-types = { path = "../aerie-port/akita/crates/akita-types", default-features = false, features = ["transcript-blake2b"] }
akita-serialization = { path = "../aerie-port/akita/crates/akita-serialization" }
akita-verifier = { path = "../aerie-port/akita/crates/akita-verifier", default-features = false, features = ["transcript-blake2b"] }
jolt-field = { git = "https://github.com/a16z/jolt", rev = "c7c2d08d5bb0c7c80501f29f723e595af7fcff3c", default-features = false, features = ["asm", "solinas"] }
serde_json = "1"

[patch."https://github.com/LayerZero-Labs/akita.git"]
akita-algebra = { path = "../aerie-port/akita/crates/akita-algebra" }
akita-challenges = { path = "../aerie-port/akita/crates/akita-challenges" }
akita-config = { path = "../aerie-port/akita/crates/akita-config" }
akita-cpu-backend = { path = "../aerie-port/akita/crates/akita-cpu-backend" }
akita-error = { path = "../aerie-port/akita/crates/akita-error" }
akita-labinius-prover = { path = "../aerie-port/akita/crates/akita-labinius-prover" }
akita-labinius-verifier = { path = "../aerie-port/akita/crates/akita-labinius-verifier" }
akita-metal = { path = "../aerie-port/akita/crates/akita-metal" }
akita-params = { path = "../aerie-port/akita/crates/akita-params" }
akita-pcs = { path = "../aerie-port/akita/crates/akita-pcs" }
akita-planner = { path = "../aerie-port/akita/crates/akita-planner" }
akita-prover = { path = "../aerie-port/akita/crates/akita-prover" }
akita-schedules = { path = "../aerie-port/akita/crates/akita-schedules" }
akita-serialization = { path = "../aerie-port/akita/crates/akita-serialization" }
akita-setup = { path = "../aerie-port/akita/crates/akita-setup" }
akita-sis-estimator = { path = "../aerie-port/akita/crates/akita-sis-estimator" }
akita-sumcheck = { path = "../aerie-port/akita/crates/akita-sumcheck" }
akita-transcript = { path = "../aerie-port/akita/crates/akita-transcript" }
akita-types = { path = "../aerie-port/akita/crates/akita-types" }
akita-verifier = { path = "../aerie-port/akita/crates/akita-verifier" }
akita-zk-prover = { path = "../aerie-port/akita/crates/akita-zk-prover" }
akita-zk-verifier = { path = "../aerie-port/akita/crates/akita-zk-verifier" }
