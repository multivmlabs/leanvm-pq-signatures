[package]
name = "riscv-raccoon-direct"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
leanvm = { path = "../../../vendor/leanVM-riscv/crates/leanvm_core" }
leanvm_guest = { path = "../../../vendor/leanVM-riscv/sdk" }
falcon-host = { path = "../../../vendor/leanVM-riscv/programs/falcon/host" }
fors-host = { path = "../../fors/host" }
mldsa-riscv-host = { path = "../../mldsa/host" }
raccoon-riscv-host = { path = "../../raccoon/host" }
raccoong-riscv-host = { path = "../../raccoon-g/host" }
bench = { path = "../../../vendor/leanVM-riscv/crates/bench" }
parallel = { path = "../../../vendor/leanVM-riscv/crates/parallel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
