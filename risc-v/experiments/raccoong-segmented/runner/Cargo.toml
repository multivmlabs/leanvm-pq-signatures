[package]
name = "raccoong-segmented-treebench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
host = { package = "raccoong-segmented-host", path = "../host" }
leanvm = { path = "../../../../vendor/leanVM-riscv/crates/leanvm_core" }
leanvm_guest = { path = "../../../../vendor/leanVM-riscv/sdk" }
bench = { path = "../../../../vendor/leanVM-riscv/crates/bench" }
parallel = { path = "../../../../vendor/leanVM-riscv/crates/parallel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
